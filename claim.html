<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Claim Payment</title><link rel="stylesheet" href="dashboard.css"><style>
body{margin:0;background:#f4f7fb;color:#18232d;font-family:"Trebuchet MS",Arial,sans-serif}.claim-shell{width:min(100%,576px);min-height:100vh;margin:auto;padding-bottom:35px}.claim-header{height:150px;padding:55px 24px 15px;background:#fff;display:flex;align-items:center;justify-content:center;position:relative}.claim-header h1{margin:0;color:#129668;font-size:34px}.claim-header a{position:absolute;left:24px;bottom:16px;color:#129668;font-size:42px;text-decoration:none}.claim-content{padding:22px 20px}.panel{padding:20px;background:#fff;border-radius:20px;box-shadow:0 6px 16px rgba(35,63,74,.06);margin-bottom:15px}.panel h2{margin:0 0 15px;color:#087b56;font-size:22px}.amount{display:block;margin:4px 0 18px;color:#d12654;font-size:36px;font-weight:800}.seller-row,.buyer-choice{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid #e0e8e7}.seller-row:last-child{border-bottom:0}.seller-row strong{margin-left:auto;text-align:right;overflow-wrap:anywhere}.method-list{display:grid;gap:10px}.method-choice{display:flex;align-items:center;gap:12px;padding:14px;border:2px solid #dce8e5;border-radius:15px;background:#fff;text-align:left;cursor:pointer;font:16px inherit}.method-choice.selected{border-color:#129668;background:#e8f7f1}.method-choice input{accent-color:#129668}.method-name{font-weight:700}.method-id{display:block;margin-top:3px;color:#75838e;font-size:14px}.button{width:100%;margin-top:16px;padding:15px;border:0;border-radius:15px;background:#129668;color:#fff;font:700 18px inherit;cursor:pointer}.button.pay{background:#ed8c19;box-shadow:0 8px 16px rgba(237,140,25,.25);font-size:21px}.button:disabled{opacity:.5;cursor:not-allowed}.timer{padding:12px;text-align:center;border-radius:12px;background:#fff0d1;color:#b87913;font-size:18px;font-weight:800}.detail-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 0;border-bottom:1px solid #e0e8e7}.detail-row:last-child{border-bottom:0}.detail-row strong{text-align:right;overflow-wrap:anywhere}.copy-button{border:0;border-radius:10px;background:#e2f4ee;color:#129668;padding:8px 11px;font:700 14px inherit;cursor:pointer}.upload-box{position:relative;display:grid;place-items:center;width:170px;height:170px;margin:8px auto 15px;border:2px dashed #b8d8d0;border-radius:14px;background:#f8fcfb;color:#8b999f;overflow:hidden;text-align:center;cursor:pointer}.upload-box input{position:absolute;inset:0;opacity:0;cursor:pointer}.upload-box img{display:none;width:100%;height:100%;object-fit:cover}.remove-proof{display:none;position:absolute;right:6px;top:6px;width:30px;height:30px;border:0;border-radius:50%;background:#e65353;color:#fff;font-size:20px;cursor:pointer}.upload-box.has-preview img{display:block}.upload-box.has-preview .upload-label{display:none}.upload-box.has-preview .remove-proof{display:block}.field{display:grid;gap:6px;color:#667582;font-size:15px;font-weight:700}.field input{padding:13px;border:1px solid #c9d9d5;border-radius:12px;font:16px inherit}.message{min-height:20px;margin-top:9px;color:#d34e4e;font-size:14px}.success{color:#129668}.back{display:block;text-align:center;color:#129668;text-decoration:none;font-weight:700}.hidden{display:none}
</style></head><body><main class="claim-shell"><header class="claim-header"><a href="payment.html" aria-label="Back">&#8592;</a><h1 id="page-title">Choose Payment Method</h1></header><section class="claim-content"><article class="panel"><h2>Amount to Buy</h2><span class="amount" id="order-amount">₹ 0.00</span><div class="timer hidden" id="timer">30:00 remaining</div></article><section id="selection-stage"><article class="panel"><h2>Seller Details</h2><div class="seller-row"><span>UPI</span><strong id="seller-upi">Loading...</strong></div><div class="seller-row"><span>Bank</span><strong id="seller-bank">Loading...</strong></div></article><article class="panel"><h2>Select Your Payment UPI</h2><div class="method-list" id="method-list"></div><div class="message" id="selection-message"></div><button class="button" id="confirm-claim" type="button">Confirm Claim</button></article></section><section id="payment-stage" class="hidden"><article class="panel"><h2>Buyer Payment Method</h2><div class="detail-row"><span>Selected UPI ID</span><strong id="buyer-upi"></strong></div></article><article class="panel"><h2>Seller Payment Details</h2><div class="detail-row"><span>UPI ID</span><strong id="seller-upi-detail"></strong><button class="copy-button" data-copy="seller-upi-detail" type="button">Copy</button></div><div class="detail-row"><span>Bank Details</span><strong id="seller-bank-detail"></strong><button class="copy-button" data-copy="seller-bank-detail" type="button">Copy</button></div><button class="button pay" id="pay-button" type="button">Go to Pay</button></article><article class="panel"><h2>Verify Payment</h2><label class="upload-box" id="upload-box"><span class="upload-label">Tap to upload<br>Payment Screenshot</span><img id="proof-preview" alt="Payment screenshot preview"><button class="remove-proof" id="remove-proof" type="button">×</button><input id="payment-proof" type="file" accept="image/*"></label><label class="field">12-digit UTR / Ref Number<input id="utr-number" inputmode="numeric" maxlength="12" placeholder="Enter 12-digit UTR"></label><div class="message" id="payment-message"></div><button class="button" id="submit-payment" type="button">Submit Payment</button></article></section><a class="back" href="dashboard.html">Return to Dashboard</a></section></main><script src="transactions.js"></script><script>
const params=new URLSearchParams(location.search),orderId=params.get('order')||`SBI${Date.now()}`,amount=Number(params.get('amount')||0),app=params.get('app')||'UPI';const upis=(()=>{try{return JSON.parse(localStorage.getItem('sbiPayWalletUpi')||'[]').filter(item=>item.enabled)}catch(error){return[]}})();const banks=(()=>{try{return JSON.parse(localStorage.getItem('sbiPayWalletBanks')||'[]')}catch(error){return[]}})();const seller=upis[0]||banks[0]||{app,upiId:'seller@upi',bankName:'Seller bank',ifsc:'IFSC pending'};const sellerUpi=seller.upiId||'No UPI listed';const sellerBank=seller.bankName?`${seller.bankName} / ${seller.ifsc||'IFSC pending'}`:seller.accountNumber?`Account Number: ${seller.accountNumber}`:'No bank listed';const selectedMethod=()=>document.querySelector('input[name="buyer-upi"]:checked');document.getElementById('order-amount').textContent=`₹ ${amount.toFixed(2)}`;document.getElementById('seller-upi').textContent=sellerUpi;document.getElementById('seller-bank').textContent=sellerBank;const methodList=document.getElementById('method-list');methodList.innerHTML=upis.length?upis.map((item,index)=>`<label class="method-choice"><input type="radio" name="buyer-upi" value="${index}"><span><span class="method-name">${item.app||'UPI'}</span><span class="method-id">${item.upiId}</span></span></label>`).join(''):'<p class="message">Add and enable a UPI method in Wallet before claiming.</p>';const selectionMessage=document.getElementById('selection-message'),timer=document.getElementById('timer');let lock=null,timerHandle=null,deadline=null;
document.getElementById('confirm-claim').addEventListener('click',()=>{const choice=selectedMethod();if(!choice){selectionMessage.textContent='Please select one of your saved UPI IDs before confirming the claim.';return}lock=sbiPayTransactions.lockOrder(orderId,amount,{app:seller.app||app,upiId:sellerUpi,bank:sellerBank});if(!lock.locked){selectionMessage.textContent='This order is currently being purchased by another user.';alert('This order is currently being purchased by another user.');return}const buyer=upis[Number(choice.value)];sbiPayTransactions.upsertPurchase(orderId,amount,{app:seller.app||app,upiId:sellerUpi,bank:sellerBank,buyerUpi:buyer.upiId});document.getElementById('buyer-upi').textContent=buyer.upiId;document.getElementById('seller-upi-detail').textContent=sellerUpi;document.getElementById('seller-bank-detail').textContent=sellerBank;document.getElementById('selection-stage').classList.add('hidden');document.getElementById('payment-stage').classList.remove('hidden');document.getElementById('page-title').textContent='Payment Details';deadline=lock.lock.expiresAt;timer.classList.remove('hidden');timerHandle=setInterval(updateTimer,1000);updateTimer()});
const updateTimer=()=>{const left=Math.max(0,deadline-Date.now());const minutes=String(Math.floor(left/60000)).padStart(2,'0'),seconds=String(Math.floor(left%60000/1000)).padStart(2,'0');timer.textContent=`${minutes}:${seconds} remaining`;if(left===0){clearInterval(timerHandle);sbiPayTransactions.timeoutPurchase(orderId);document.getElementById('payment-message').textContent='This order timed out and is available again.';document.getElementById('submit-payment').disabled=true;document.getElementById('pay-button').disabled=true}};
document.querySelectorAll('[data-copy]').forEach(button=>button.addEventListener('click',async()=>{const value=document.getElementById(button.dataset.copy).textContent;try{await navigator.clipboard.writeText(value);button.textContent='Copied';setTimeout(()=>button.textContent='Copy',1200)}catch(error){window.prompt('Copy this value:',value)}}));document.getElementById('pay-button').addEventListener('click',()=>{const appName=(seller.app||app).toLowerCase(),upi=encodeURIComponent(sellerUpi),value=encodeURIComponent(amount),link=appName.includes('phone')?`phonepe://pay?pa=${upi}&am=${value}&cu=INR`:appName.includes('google')?`tez://upi/pay?pa=${upi}&am=${value}&cu=INR`:`paytmmp://pay?pa=${upi}&am=${value}&cu=INR`;location.href=link});const proof=document.getElementById('payment-proof'),box=document.getElementById('upload-box'),preview=document.getElementById('proof-preview');proof.addEventListener('change',()=>{const file=proof.files[0];if(!file||!file.type.startsWith('image/')){alert('Please select a valid payment screenshot.');return}preview.src=URL.createObjectURL(file);box.classList.add('has-preview')});document.getElementById('remove-proof').addEventListener('click',event=>{event.preventDefault();proof.value='';preview.removeAttribute('src');box.classList.remove('has-preview')});document.getElementById('submit-payment').addEventListener('click',()=>{const file=proof.files[0],utr=document.getElementById('utr-number').value.trim();if(!file&&!/^\d{12}$/.test(utr)){alert('Please upload the payment screenshot and enter the valid UTR number.');return}if(!file){alert('Please upload the payment screenshot.');return}if(!/^\d{12}$/.test(utr)){alert('Please enter the valid 12-digit UTR number.');return}const completed=sbiPayTransactions.completePurchase(orderId,utr);if(!completed){alert('This order is no longer available.');return}clearInterval(timerHandle);document.getElementById('payment-message').className='message success';document.getElementById('payment-message').textContent='Payment verified. Order marked Success.';document.getElementById('submit-payment').disabled=true;document.getElementById('pay-button').disabled=true});
<style>#selection-stage{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;background:rgba(20,28,35,.56)}#selection-stage .panel:first-child{display:none}#selection-stage .panel:last-child{width:100%;margin:0;padding:24px 28px 28px;border-radius:25px 25px 0 0;box-shadow:0 -5px 22px rgba(0,0,0,.14)}#selection-stage .panel:last-child h2{font-size:28px;margin-bottom:18px}#selection-stage .method-list{gap:9px;max-height:38vh;overflow:auto}#selection-stage .method-choice{min-height:68px;padding:10px 14px;border:1px solid #dbe8e4;border-radius:15px;background:#f8fbfa}#selection-stage .method-choice:has(input:checked){border-color:#149b6c;background:#e5f5ee}#selection-stage .method-choice input{margin-left:auto;order:2;width:22px;height:22px}#selection-stage .button{border-radius:28px}.payment-stage-card{background:#e8f7f0!important;border-radius:0 0 22px 22px!important;padding-top:20px!important}.payment-stage-card .amount{margin:0;text-align:center;font-size:48px}.payment-stage-card .amount:before{content:"INR ";color:#129668}.voucher-label{display:grid!important;place-items:center;width:100%;height:76px;margin-top:14px;border:1px solid #b8d8d0;border-radius:38px;color:#129668;font-size:19px;cursor:pointer}.voucher-label input{display:none}</style></script></body></html>
