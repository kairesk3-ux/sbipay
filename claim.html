<!-- SELECT TOOL POPUP MODAL -->
<div id="tool-modal-overlay" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 9999; align-items: center; justify-content: center; padding: 16px;">
  <div style="background: #ffffff; width: 100%; max-width: 360px; border-radius: 20px; padding: 22px 20px 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
    
    <div style="color: #0e7a53; font-size: 20px; font-weight: 700; margin-bottom: 20px;">Select tool</div>

    <div id="modal-tool-list" style="display: flex; flex-direction: column; gap: 16px; margin-bottom: 20px; max-height: 220px; overflow-y: auto;">
      <!-- UPI ऑप्शंस यहाँ लोड होंगे -->
    </div>

    <p style="font-size: 11px; color: #7a8b86; line-height: 1.4; margin-bottom: 22px;">
      * After selecting the payment tool, please use the selected tool to make payment, otherwise the account will not be credited.
    </p>

    <div style="display: flex; gap: 12px;">
      <button id="modal-btn-cancel" type="button" style="flex: 1; padding: 12px; border: 1px solid #e0e0e0; border-radius: 10px; background: #fff; color: #0e7a53; font-size: 16px; font-weight: 700; cursor: pointer;">Cancel</button>
      <button id="modal-btn-confirm" type="button" style="flex: 1; padding: 12px; border: none; border-radius: 10px; background: #0e7a53; color: #fff; font-size: 16px; font-weight: 700; cursor: pointer;">Confirm</button>
    </div>

  </div>
</div>

<script>
  let currentClaimAmount = '0';
  let currentOrderId = '';

  // 1. जब भी कोई आपके क्लेम बटन पर क्लिक करे, यह फंक्शन कॉल करें: openClaimModal(amount, orderId)
  function openClaimModal(amount, orderId) {
    currentClaimAmount = amount || '0';
    currentOrderId = orderId || `ORD${Date.now()}`;

    // वॉलेट से ऐड की हुई UPI लोड करना
    let savedUpis = [];
    try {
      savedUpis = JSON.parse(localStorage.getItem('sbiPayWalletUpi') || '[]').filter(item => item.enabled !== false);
    } catch(e) {
      savedUpis = [];
    }

    if (savedUpis.length === 0) {
      savedUpis = [
        { app: 'Mobikwik', upiId: '8837022561' },
        { app: 'Paytm', upiId: '8837022561' }
      ];
    }

    // लिस्ट रेंडर करना
    const toolList = document.getElementById('modal-tool-list');
    toolList.innerHTML = savedUpis.map((item, index) => {
      const appName = item.app || 'UPI';
      const isMobikwik = appName.toLowerCase().includes('mobi');
      const isPaytm = appName.toLowerCase().includes('paytm');

      let iconUrl = 'https://cdn-icons-png.flaticon.com/512/2721/2721064.png';
      if (isMobikwik) iconUrl = 'https://s3.ap-south-1.amazonaws.com/mobikwik-images/images/mobikwik_logo.png';
      if (isPaytm) iconUrl = 'https://cdn.iconscout.com/icon/free/png-256/free-paytm-3521643-2945092.png';

      return `
        <label style="display: flex; align-items: center; justify-content: space-between; cursor: pointer;">
          <div style="display: flex; align-items: center; gap: 12px;">
            <img src="${iconUrl}" style="width: 38px; height: 38px; border-radius: 8px; object-fit: contain;" alt="${appName}">
            <div>
              <span style="display: block; font-size: 16px; font-weight: 700; color: #111;">${appName}</span>
              <span style="display: block; font-size: 13px; color: #666; margin-top: 2px;">${item.upiId}</span>
            </div>
          </div>
          <input type="radio" name="popup_selected_tool" value="${index}" style="width: 20px; height: 20px; accent-color: #0e7a53; cursor: pointer;" ${index === 0 ? 'checked' : ''}>
        </label>
      `;
    }).join('');

    // मोडल दिखाएं
    const modal = document.getElementById('tool-modal-overlay');
    modal.style.display = 'flex';
  }

  // Cancel बटन से पॉप-अप बंद करें
  document.getElementById('modal-btn-cancel').addEventListener('click', () => {
    document.getElementById('tool-modal-overlay').style.display = 'none';
  });

  // Confirm बटन से deposit_buy.html पर ले जाएं
  document.getElementById('modal-btn-confirm').addEventListener('click', () => {
    const selectedRadio = document.querySelector('input[name="popup_selected_tool"]:checked');
    if (!selectedRadio) return;

    let savedUpis = [];
    try {
      savedUpis = JSON.parse(localStorage.getItem('sbiPayWalletUpi') || '[]').filter(item => item.enabled !== false);
    } catch(e) {}
    if (savedUpis.length === 0) {
      savedUpis = [
        { app: 'Mobikwik', upiId: '8837022561' },
        { app: 'Paytm', upiId: '8837022561' }
      ];
    }

    const selectedUPI = savedUpis[Number(selectedRadio.value)];
    const targetUrl = `deposit_buy.html?order=${encodeURIComponent(currentOrderId)}&amount=${encodeURIComponent(currentClaimAmount)}&app=${encodeURIComponent(selectedUPI.app || 'UPI')}&upi=${encodeURIComponent(selectedUPI.upiId)}`;
    
    window.location.href = targetUrl;
  });
</script>
